name: 傷が限界
desc: 隠しHPがゼロになる（world.json トリガー too-hurt）：夏澄があなたを2号車へ支えて戻し、あなたはもう歩けなくなり、列車は五時に予定どおり発車する
do:
  - action: event
    with:
      target: characters/xia-cheng
      title: 夏澄があなたを支えて戻った
      text: あなたは車両の壁に手をかけ、脚の力が抜けてその場に座り込んだ。夏澄が懐中電灯を手に探しに来て、あなたの腕を自分の肩に回し、一両ずつ2号車へ支えて戻り、18号の席に横たえさせ、自分の綿のコートをあなたにかけた。あなたは17号のことがまだ終わっていないと言いたかったが、まぶたはどうしても開かなくなった。今夜残ったことは、もうあなたが調べるのではない。
  - action: end
    with:
      ending: departed
