name: 遠回り：食堂車
desc: 食堂車の捜索がうまくいかなかったあと、賀じいと石炭入れをひっくり返して5号車の鍵を見つける。時間を一歩余計に消費する
do:
  - action: give
    with:
      path: player/freight-key.md
      title: 赤札付きの5号車の鍵
      frontmatter:
        type: note
        image: assets/items/freight-key.webp
        portable: true
      body: 食堂車の湯沸かし器のそばの石炭入れで見つけた鍵。赤札には「5号車 荷物車」と書かれている。誰かが運転室に掛け戻す勇気がなく、ここに放り込んだのだ。これを持てば、車尾の荷物車を開けられる。
  - action: set_status
    with:
      path: world/dining-car/05-long-way.md
      values:
        done: yes
  - action: tick
    with:
      by: "-1"
