name: 绕远路：7号码头
desc: 7号码头的调查骰没查全之后，当面请银鸢打开货舱。多耗一段潮水；手里的半条线（漆片）收进完整的证据
do:
  - action: edit
    when: 'has("player/decoy-ship-half.md")'
    with:
      path: player/decoy-ship-half.md
      frontmatter:
        title: 半条线 · 已补全（见包里的证据）
  - action: set_status
    with:
      path: world/harbor-chart/seventh-berth/05-long-way.md
      values:
        done: "yes"
  - action: tick
    with:
      by: "-1"
