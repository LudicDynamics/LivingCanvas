name: 绕远路：旧灯塔
desc: 旧灯塔的调查骰没查全之后，请老莫拿日志一分一分对。多耗一段潮水；手里的半条线（潮汐表）收进完整的证据
do:
  - action: edit
    when: 'has("player/customs-tunnel-half.md")'
    with:
      path: player/customs-tunnel-half.md
      frontmatter:
        title: 半条线 · 已补全（见包里的证据）
  - action: set_status
    with:
      path: world/harbor-chart/old-lighthouse/05-long-way.md
      values:
        done: "yes"
  - action: tick
    with:
      by: "-1"
