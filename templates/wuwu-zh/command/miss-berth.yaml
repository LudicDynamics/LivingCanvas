name: 7号码头没查全
desc: 7号码头的判定落在 61–100。61–95 只拿到半条线（漆片）；96–100 被银鸢撞见（落在角色上的事件）。两种都要绕远路才能钉上这条线
do:
  - action: give
    when: 'roll.rank >= 2'
    with:
      path: player/decoy-ship-half.md
      title: 半条线 · 别的船留下的漆片
      frontmatter:
        type: note
        portable: true
      body: |
        你没来得及打开货舱，只从比满潮线还高的擦痕上刮下一片焦油色的黑漆。它和无人船的船壳对不上——另一艘船贴着它挤过去过。

        这只能证明有第二艘船，证明不了无人船是诱饵。要钉上这条线，得绕远路：当面请银鸢打开货舱。
  - action: event
    when: 'roll.rank == 1'
    with:
      target: characters/silver-kite
      title: 被银鸢撞见了
      text: 你刚摸到舷梯顶上，银鸢就揪住了你的衣领。他什么也没说，只把舷梯对你关上了。想知道货舱里有什么，得当面去找他，说清你为什么偷偷上船。
  - action: set_status
    with:
      path: world/harbor-chart/seventh-berth/05-long-way.md
      values:
        open: "yes"
  - action: edit
    with:
      path: world/harbor-chart/05-accuse.md
      append_body: ✗ 7号码头的线还没钉上：货舱没打开。得绕远路，当面请银鸢开舱。
