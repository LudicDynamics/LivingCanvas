name: 旧灯塔没查全
desc: 旧灯塔的判定落在 61–100。61–95 只拿到半条线（潮汐表）；96–100 摔裂了老莫的望远镜（落在角色上的事件）。两种都要绕远路才能钉上这条线
do:
  - action: give
    when: 'roll.rank >= 2'
    with:
      path: player/customs-tunnel-half.md
      title: 半条线 · 今晚的潮汐表
      frontmatter:
        partial: true
        type: note
        portable: true
      body: |
        雾盖住了隧道口，你只拿到老莫桌上今晚的潮汐表：旧海关隧道口什么时候会露出水面。

        它说明隧道什么时候能用，说明不了熄灯的十二分钟正好对着它。要钉上这条线，得绕远路：请老莫拿日志，和潮汐表一分一分对。
  - action: event
    when: 'roll.rank == 1'
    with:
      target: characters/old-mo
      title: 望远镜摔裂了
      text: 老莫的黄铜望远镜从你手里滑下灯廊的栏杆，磕在石头上，镜片裂了。他看见了，一句话也没说，把碎镜片一片片捡起来。想再从他嘴里问出那夜的事，得先好好道个歉。
  - action: set_status
    with:
      path: world/harbor-chart/old-lighthouse/05-long-way.md
      values:
        open: "yes"
  - action: edit
    with:
      path: world/harbor-chart/05-accuse.md
      append_body: ✗ 旧灯塔的线还没钉上：没看清隧道口。得绕远路，请老莫拿日志一分一分对。
