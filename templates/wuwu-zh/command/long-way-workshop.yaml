name: 绕远路：工坊
desc: 工坊的调查骰没查全之后，请薇拉去翻订货簿。多耗一段潮水；手里的半条线（纹章拓印）收进完整的证据
do:
  - action: edit
    when: 'has("player/ledger-page-half.md")'
    with:
      path: player/ledger-page-half.md
      frontmatter:
        title: 半条线 · 已补全（见包里的证据）
  - action: set_status
    with:
      path: world/harbor-chart/workshop/05-long-way.md
      values:
        done: "yes"
  - action: tick
    with:
      by: "-1"
