name: 钉上第二条线：旧海关隧道
desc: 旧灯塔的判定成功（60以下）或绕远路之后，把“熄灯的十二分钟与旧海关隧道”作为证据放进包里，并在海图上打钩
do:
  - action: give
    with:
      path: player/customs-tunnel.md
      title: 证据 · 旧海关隧道与熄灯的十二分钟
      frontmatter:
        type: note
        portable: true
      body: |
        熄灯的十二分钟，正好是潮水让旧海关隧道出口能过船的那一段。黑着灯，隧道口出去的船谁也看不见。

        老莫承认灯是他熄的，可他说不出那段时间里有什么船——他确实不知道有一艘船跟在后面。
  - action: set_status
    with:
      path: world/harbor-chart/05-accuse.md
      values:
        tunnel: "yes"
  - action: edit
    with:
      path: world/harbor-chart/05-accuse.md
      append_body: ✓ 旧灯塔的线钉上了：熄灯的十二分钟，对着旧海关隧道的出口。
