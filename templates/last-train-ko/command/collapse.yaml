name: 부상이 한계다
desc: "숨겨진 체력이 0이 됨(world.json 트리거 too-hurt): 샤청이 당신을 2호차로 부축해 돌아가고, 당신은 더 이상 걸을 수 없으며, 열차는 5시에 예정대로 떠난다"
do:
  - action: event
    with:
      target: characters/xia-cheng
      title: 샤청이 당신을 부축해 돌아갔다
      text: 당신은 객차 벽을 짚고 있다가 다리에 힘이 풀려 주저앉았다. 샤청이 손전등을 들고 찾아와 당신의 팔을 자기 어깨에 걸치고, 한 칸씩 부축해 2호차로 돌아가 18번 좌석에 눕히고는 자기 솜코트를 당신 위에 덮어주었다. 당신은 17번 일이 아직 끝나지 않았다고 말하려 했지만, 눈꺼풀이 도저히 떠지지 않았다. 오늘 밤 남은 일은 당신이 조사하지 않게 되었다.
  - action: end
    with:
      ending: departed
