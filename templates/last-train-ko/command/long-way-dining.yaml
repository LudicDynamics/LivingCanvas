name: "돌아가기: 식당차"
desc: 식당차 수색이 잘 안 된 뒤, 허 영감과 석탄통을 쏟아 5호차 열쇠를 찾는다. 시간을 한 걸음 더 쓴다
do:
  - action: give
    with:
      path: player/freight-key.md
      title: 빨간 팻말이 달린 5호차 열쇠
      frontmatter:
        type: note
        image: assets/items/freight-key.webp
        portable: true
      body: 식당차 온수기 옆 석탄통에서 찾은 열쇠. 빨간 팻말에 "5호차 화물차"라고 적혀 있다. 누군가 감히 운전실에 다시 걸지 못해 여기에 던져 두었다. 이것을 가지고 있으면 차량 끝 화물차를 열 수 있다.
  - action: set_status
    with:
      path: world/dining-car/05-long-way.md
      values:
        done: yes
  - action: tick
    with:
      by: "-1"
