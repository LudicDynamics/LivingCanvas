name: "돌아가기: 3번 객실"
desc: 객실 수색이 잘 안 된 뒤, 샤청이 중화이리를 검표로 불러내고 너는 베개 밑에서 약판을 가져간다. 시간을 한 걸음 더 쓴다
do:
  - action: give
    with:
      path: player/pill-strip.md
      title: 두 정이 없어진 수면제 판
      frontmatter:
        type: note
        image: assets/items/pill-strip.webp
        portable: true
      body: 중화이리 베개 밑의 수면제 판, 처방전에는 그의 이름이 인쇄되어 있다. 10정들이, 두 정이 없어졌고, 은박은 새로 뜯긴 것이다. 그는 11시 30분에 약을 먹고 잤다고 했지만—수면제 두 정을 먹은 사람이라면, 이렇게 얕게 잠들어서는 안 된다.
  - action: set_status
    with:
      path: world/sleeper/05-long-way.md
      values:
        done: yes
  - action: tick
    with:
      by: "-1"
