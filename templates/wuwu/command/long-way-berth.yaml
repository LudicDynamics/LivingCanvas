name: "Long Way Around: Berth 7"
desc: After the Berth 7 roll falls short, ask Silver Kite face to face to open the cargo hold. Costs one more stretch of tide; the half thread in hand (paint flake) becomes full evidence
do:
  - action: edit
    when: has("player/decoy-ship-half.md")
    with:
      path: player/decoy-ship-half.md
      frontmatter:
        title: Half a Thread · Completed (see evidence in bag)
  - action: set_status
    with:
      path: world/harbor-chart/seventh-berth/05-long-way.md
      values:
        done: yes
  - action: tick
    with:
      by: "-1"
