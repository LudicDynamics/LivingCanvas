name: "두 번째 실마리 못 박기: 옛 세관 터널"
desc: 옛 등대의 판정 성공(60 이하) 또는 돌아가기 후, '꺼진 십이 분과 옛 세관 터널'을 증거로 가방에 넣고 해도에 ✓를 찍는다
do:
  - action: give
    with:
      path: player/customs-tunnel.md
      title: 증거 · 옛 세관 터널과 꺼진 십이 분
      frontmatter:
        type: note
        portable: true
      body: |
        등대가 꺼진 십이 분은, 마침 조수가 옛 세관 터널 출구로 배가 지나갈 수 있게 해 주는 시간대와 겹친다. 불을 끄면 터널 출구로 나가는 배를 아무도 볼 수 없다.

        모 영감은 불을 끈 것이 자신이라고 인정했지만, 그 시간에 무슨 배가 있었는지는 말하지 못했다—그는 뒤에 배 한 척이 따라오고 있었다는 것을 정말로 몰랐다.
  - action: set_status
    with:
      path: world/harbor-chart/05-accuse.md
      values:
        tunnel: yes
  - action: edit
    with:
      path: world/harbor-chart/05-accuse.md
      append_body: "✓ 옛 등대의 실마리를 못 박았다: 꺼진 십이 분은 옛 세관 터널 출구를 향한다."
