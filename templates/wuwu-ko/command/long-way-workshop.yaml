name: "돌아가기: 공방"
desc: 공방의 조사 판정을 다 살피지 못한 뒤, 베라에게 주문 장부를 뒤져 달라 청한다. 조수가 한 걸음 더 밀려온다. 손에 있던 반쪽 실마리(문장 탁본)가 온전한 증거로 들어온다
do:
  - action: edit
    when: has("player/ledger-page-half.md")
    with:
      path: player/ledger-page-half.md
      frontmatter:
        title: 반쪽 실마리 · 보완됨(가방 속 증거 참조)
  - action: set_status
    with:
      path: world/harbor-chart/workshop/05-long-way.md
      values:
        done: yes
  - action: tick
    with:
      by: "-1"
