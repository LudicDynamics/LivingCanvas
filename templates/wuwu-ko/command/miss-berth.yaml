name: 7번 부두를 다 못 살폈다
desc: 7번 부두의 판정이 61–100에 떨어졌다. 61–95는 반쪽 실마리(페인트 조각)만 얻는다. 96–100은 은솔개에게 들킨다(캐릭터에 남는 사건). 어느 쪽이든 돌아가기를 거쳐야 이 실마리를 못 박을 수 있다
do:
  - action: give
    when: roll.rank >= 2
    with:
      path: player/decoy-ship-half.md
      title: 반쪽 실마리 · 다른 배가 남긴 페인트 조각
      frontmatter:
        type: note
        portable: true
      body: |
        너는 화물칸을 열지 못한 채, 만조선보다 높은 긁힌 자국에서 타르색 검은 페인트 한 조각만 긁어냈다. 그것은 무인선의 선체와 맞지 않는다. 다른 배가 그 배에 바짝 붙어 지나간 것이다.

        이것만으로는 두 번째 배가 있었다는 것만 증명할 뿐, 무인선이 미끼라는 것은 증명하지 못한다. 이 실마리를 못 박으려면 돌아가기를 거쳐 은솔개에게 직접 화물칸을 열어 달라 청해야 한다.
  - action: event
    when: roll.rank == 1
    with:
      target: characters/silver-kite
      title: 은솔개에게 들켰다
      text: 네가 현문 사다리 꼭대기에 손을 댔을 때, 은솔개가 네 옷깃을 붙잡았다. 그는 아무 말도 없이 너에게 사다리를 닫아 버렸다. 화물칸에 무엇이 있는지 알려면 직접 찾아가서 왜 몰래 배에 올랐는지 밝혀야 한다.
  - action: set_status
    with:
      path: world/harbor-chart/seventh-berth/05-long-way.md
      values:
        open: yes
  - action: edit
    with:
      path: world/harbor-chart/05-accuse.md
      append_body: "✗ 7번 부두의 실마리는 아직 못 박히지 않았다: 화물칸이 열리지 않았다. 돌아가기를 거쳐 은솔개에게 직접 화물칸을 열어 달라 청해야 한다."
