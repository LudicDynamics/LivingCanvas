name: "돌아가기: 옛 등대"
desc: 옛 등대의 조사 판정을 다 살피지 못한 뒤, 모 영감에게 일지를 일 분씩 대조해 달라 청한다. 조수가 한 걸음 더 밀려온다. 손에 있던 반쪽 실마리(조석표)가 온전한 증거로 들어온다
do:
  - action: edit
    when: has("player/customs-tunnel-half.md")
    with:
      path: player/customs-tunnel-half.md
      frontmatter:
        title: 반쪽 실마리 · 보완됨(가방 속 증거 참조)
  - action: set_status
    with:
      path: world/harbor-chart/old-lighthouse/05-long-way.md
      values:
        done: yes
  - action: tick
    with:
      by: "-1"
