name: "돌아가기: 해도"
desc: 해도 위의 결정적 판정을 제대로 보지 못한 뒤, 물가를 따라 물자국을 쫓는다. 조수가 한 걸음 더 밀려온다. 손에 있던 반쪽 실마리(물자국)가 온전한 증거로 들어온다
do:
  - action: edit
    when: has("player/second-wake-half.md")
    with:
      path: player/second-wake-half.md
      frontmatter:
        title: 반쪽 실마리 · 보완됨(가방 속 증거 참조)
  - action: set_status
    with:
      path: world/harbor-chart/06-long-way.md
      values:
        done: yes
  - action: tick
    with:
      by: "-1"
