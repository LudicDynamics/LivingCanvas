name: 遠回り：工房
desc: 工房の調査ダイスを全部振り切らなかった後、ヴェラに注文帳を調べてもらう。潮を一段余分に使う。手元の半本の糸（紋章の拓本）が完全な証拠になる
do:
  - action: edit
    when: has("player/ledger-page-half.md")
    with:
      path: player/ledger-page-half.md
      frontmatter:
        title: 半本の糸・補完済み（鞄の中の証拠を参照）
  - action: set_status
    with:
      path: world/harbor-chart/workshop/05-long-way.md
      values:
        done: yes
  - action: tick
    with:
      by: "-1"
