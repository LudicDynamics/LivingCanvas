name: 霧の中ではっきり見えなかった
desc: 海図上の決定的な判定は61–100に落ちる（灯油を持っている96–100も含む）。61–95は半本の糸（一筋の航跡）しか見えない。どちらも遠回りしないとこの糸は留められない
do:
  - action: give
    when: roll.rank >= 2
    with:
      path: player/second-wake-half.md
      title: 半本の糸・霧の中の一筋の航跡
      frontmatter:
        type: note
        portable: true
      body: |
        船は見えず、霧の中に巻き上がる一筋の航跡だけが見えた。旧税関隧道の入り口の方から曲がり出て、また霧に消えていった。

        何かがちょうど通り過ぎたが、それが何かは分からない。この糸を留めるには、遠回りしなければならない：岸沿いに航跡を追って歩く。
  - action: set_status
    with:
      path: world/harbor-chart/06-long-way.md
      values:
        open: yes
  - action: edit
    with:
      path: world/harbor-chart/05-accuse.md
      append_body: ✗ 海図上の糸はまだ留められていない：霧の中ではっきり見えなかった。遠回りして、岸沿いに航跡を追う必要がある。
