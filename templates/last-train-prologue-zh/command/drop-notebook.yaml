name: 17号座上的笔记本
desc: 第一回合结束后，苏禾留下的笔记本落到2车的画布上（触发器 notebook）。
do:
- action: give
  with:
    path: world/seated-car/su-he-notebook.md
    title: 苏禾留下的笔记本
    frontmatter:
      type: note
      image: assets/items/su-he-notebook.webp
      portable: true
      choice:
        options:
        - id: take
          label: 拿起笔记本
      choice_actions:
        take:
          kind: take
          paths:
          - world/seated-car/su-he-notebook.md
    body: '摊开的那一页，字写得很用力：


      “今晚车上有他。十二年了，爸爸的日志我一直带在身上。到了岭口，我要他当着所有人的面认。”


      没写他是谁。'
- action: event
  with:
    target: characters/xia-cheng
    title: 17号座上的笔记本
    text: 夏澄把手电照向17号座：帆布包底下压着一本摊开的笔记本。“这是她的……你看看，上面写了什么？”
