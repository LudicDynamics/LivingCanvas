name: 'Leave without a spell'
desc: 'The player decides to end the lesson without casting; a spell already cast still counts'
do:
  - action: end
    when: 'has("world/spell-atlas/star-chart-room/01-my-spell.md")'
    with:
      ending: opened-door
  - action: end
    when: 'has("world/spell-atlas/palm-stars/01-my-spell.md")'
    with:
      ending: kept-stars
  - action: end
    with:
      ending: unnamed
