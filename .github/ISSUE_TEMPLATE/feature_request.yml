name: Feature request
description: An idea for a mechanic, a tool, or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work in play. Sketches and examples welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
